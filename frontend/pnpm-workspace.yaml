packages:
  - '.'

# Three days of quarantine: a freshly published version is not installed until
# it has been on the registry long enough for a compromised release to be
# noticed and pulled. Do not lower this.
minimumReleaseAge: 4320
minimumReleaseAgeIgnoreMissingTime: false
resolutionMode: highest

# pnpm needs an explicit decision per package with a postinstall script; a
# blocked postinstall is the safe default. This is a browser bundle, so none of
# these native builds is ever loaded.
allowBuilds:
  # Optional native speedups for `ws` (WalletConnect) in Node; ws falls back to
  # plain JS, and the browser uses its own WebSocket anyway.
  bufferutil: false
  'utf-8-validate': false
  # Native keccak binding with a pure JS fallback, which is what a bundle uses.
  keccak: false
  # esbuild's binary comes from its platform-specific optional dependency
  # (e.g. @esbuild/linux-x64), so its postinstall is not needed.
  esbuild: false

overrides:
  # RainbowKit pins cuer@0.0.3 for its WalletConnect QR code. cuer depends on
  # `qr: ~0` and calls it with `border: 0`, which qr rejects since 0.6.0
  # ("RangeError: invalid border=0"), so the QR modal crashes. 0.5.5 is the
  # last release that accepts it (same fix as consolideth-monorepo). Drop this
  # once cuer/RainbowKit ship a fix.
  'cuer>qr': 0.5.5
  # Close published advisories in transitive dependencies (pnpm audit, 16 Oct
  # 2026), pinned to exact patched releases at least two weeks old. Both come
  # with WalletConnect/MetaMask under wagmi; the yarn resolutions already forced
  # uuid 11 and ws 8.21 before the migration.
  ws@>=8.0.0 <8.21.0: 8.21.3
  uuid@<11.1.1: 11.1.1
